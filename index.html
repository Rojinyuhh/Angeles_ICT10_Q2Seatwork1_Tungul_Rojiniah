<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocSci Club Membership Checker </title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body{
            background-color: #28151D;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        .container{
            background-color: #E8DFD0;
            width: 600px;
            height: 400px;
            color: #35121D;
            padding: 35px;
            margin-top: 50px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            border-top: 10px solid #632b3e;
        }

        #result {
            display: none;
            background-color: #E8DFD0;
            color: #35121D;
            padding: 35px;
            width: 600px;
            height: 90px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            padding: 15px 35px;
            font-size: 20px;
            margin: 35px auto 70px;
            border-left: 8px solid #632b3e;
            align-items: center;
            justify-content: center;
        }

        #message{
            margin: 0;
            text-align: center;
        }
        
        .site-header{
            background-color: #4A1728;
            padding: 20px;
            color: #E8DFD0;
        }

        .header-content{
            max-width: 1100px;
            margin-left: 25px;
        }

        .club-name{
            color: #B7A89A;
            font-size: 20px;
        }

        .portal-name{
            font-size: 17px;
        }

        .gold-line{
            width: 127%;
            height: 3px;
            background-color: #B89559;
            margin: 25px 0 ;
            border-radius: 10px;
        }

        .form-label{
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #35121D;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #B7A89A;
            border-radius: 6px;
            background-color: #F5EFE6;
            color: #35121D;
        }

        .btn{
            background-color: #641F35;
            border-color: #641F35;
            color: white;
            padding: 12px 30px;
            font-weight: bold;
            border-radius: 6px;
            display: block;
            width: 100%;
        }

        .btn:hover{
            background-color: #35121D;
            border-color: #35121D;
            color: white;
        }

        .title{
            color: #E8DFD0;
            display: block;
            text-align: center;
            margin-top: 50px;
        }

        .container h3, .container p{
            text-align: center;
        }


    </style>

</head>
<body>
    <header class="site-header">
    <div class="header-content">
        <p class="club-name">SOCIAL SCIENCE CLUB</p>
        <p class="portal-name">MEMBERSHIP PORTAL</p>

        <div class="gold-line"></div>
    </div>
</header>

    <div class="title">
    <h1>Candidate Verification</h1>
        <p class="header-description">
            Your place in our community starts here.
        </p>
    </div>

    <div class="container mt-5">
        <h3>Verify your membership</h3>
        <p>Enter your details to verify your membership status</p>
        <label class="form-label">First Name</label>
        <input type="text" id="first_name" placeholder="Enter your first name">

        <label class="form-label">Last Name</label>
        <input type="text" id="last_name" placeholder="Enter your last name">
        
        <button type="button" class="btn" py-click="check_member">Check Membership</button>
    </div>

    <div id="result">
        <p id="message"></p>
    </div>

    <py-script src="main.py"></py-script>

</body>
</html>
